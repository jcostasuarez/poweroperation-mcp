[package]
name = "poweroperation-mcp"
version = "0.3.0"
edition = "2024"
description = "Servidor MCP para EcoStruxure Power Operation (Plant SCADA / Citect): CtAPI, alarmas ODBC y proyecto offline"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
encoding_rs = "0.8.42"
libloading = "0.9.0"
odbc-api = "29.2.0"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
